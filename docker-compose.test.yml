version: '3.9'

services:
  db:
    image: mysql:8.0
    container_name: journal_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: journal
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pexample"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

  app:
    build: .
    container_name: mood-journal-api
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://root:example@db:3306/journal
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  tests:
    build:
      context: ../mood_journal_test_a636bcc3-d318-4475-bae8-cd0cb8e19b1e
    container_name: mood-journal-tests
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy

networks:
  default:
    name: mood-journal-net
