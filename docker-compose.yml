services:
  db:
    image: mysql:8.0
    container_name: journal_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example
      MYSQL_DATABASE: journal
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://root:example@db:3306/journal
      HUGGING_FACE_TOKEN: "${HUGGING_FACE_TOKEN}"
    depends_on:
      - db
    restart: on-failure